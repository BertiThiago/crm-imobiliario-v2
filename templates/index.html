<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImobiCRM Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0b0e14;
  --bg2: #111520;
  --bg3: #161b27;
  --card: #1a2030;
  --border: #252d3d;
  --accent: #e8a020;
  --accent2: #f5c842;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #a855f7;
  --text: #e8eaf0;
  --text2: #8b95a8;
  --text3: #5a6377;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); font-size:14px; }

/* SCROLLBAR */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent); }

/* LOGIN */
#login-screen {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 30% 20%, #1a2a3a 0%, #0b0e14 70%);
  z-index:1000;
}
.login-box {
  width:420px; background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:48px 40px; box-shadow:0 24px 80px rgba(0,0,0,0.6);
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.login-logo { text-align:center; margin-bottom:32px; }
.login-logo .icon { width:64px; height:64px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-size:28px; margin:0 auto 12px; box-shadow:0 8px 24px rgba(232,160,32,0.4); }
.login-logo h1 { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; }
.login-logo p { color:var(--text2); font-size:13px; margin-top:4px; }
.login-box label { display:block; font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase; }
.login-box input { width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  padding:12px 16px; border-radius:10px; font-size:14px; outline:none; transition:.2s; margin-bottom:16px; font-family:inherit; }
.login-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,160,32,0.1); }
.btn-login { width:100%; padding:14px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000; font-weight:700; font-family:'Syne',sans-serif; font-size:15px; border:none;
  border-radius:10px; cursor:pointer; transition:.2s; letter-spacing:.5px; }
.btn-login:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(232,160,32,0.4); }
.login-error { color:var(--red); font-size:13px; text-align:center; margin-top:12px; }

/* LAYOUT */
#app { display:flex; height:100vh; overflow:hidden; }
#sidebar {
  width:240px; min-width:240px; background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 0; transition:.3s;
}
.sidebar-logo { padding:0 20px 24px; border-bottom:1px solid var(--border); margin-bottom:8px; }
.sidebar-logo .brand { display:flex; align-items:center; gap:10px; }
.sidebar-logo .brand-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.sidebar-logo h2 { font-family:'Syne',sans-serif; font-size:16px; font-weight:800; line-height:1.2; }
.sidebar-logo h2 span { color:var(--accent); }
.nav-section { padding:8px 12px 4px; font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:1px; }
.nav-item {
  display:flex; align-items:center; gap:12px; padding:10px 20px;
  color:var(--text2); cursor:pointer; transition:.15s; border-left:3px solid transparent;
  font-size:13.5px; font-weight:500; position:relative; text-decoration:none;
}
.nav-item:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.nav-item.active { color:var(--accent); background:rgba(232,160,32,0.08); border-left-color:var(--accent); }
.nav-item i { width:18px; text-align:center; font-size:14px; }
.nav-badge { margin-left:auto; background:var(--red); color:#fff; font-size:10px;
  font-weight:700; padding:2px 6px; border-radius:10px; }
.sidebar-footer { margin-top:auto; padding:16px 20px; border-top:1px solid var(--border); }
.user-pill { display:flex; align-items:center; gap:10px; }
.user-avatar { width:32px; height:32px; background:linear-gradient(135deg,var(--accent),var(--purple));
  border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#000; }
.user-info p { font-size:13px; font-weight:500; }
.user-info span { font-size:11px; color:var(--text3); }
.btn-logout { margin-left:auto; background:none; border:none; color:var(--text3); cursor:pointer; font-size:14px; }
.btn-logout:hover { color:var(--red); }

/* MAIN */
#main { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
.topbar {
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:16px 28px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:10;
}
.topbar h1 { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; flex:1; }
.topbar-actions { display:flex; align-items:center; gap:10px; }
.content { padding:24px 28px; flex:1; }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:9px;
  font-size:13px; font-weight:600; cursor:pointer; border:none; transition:.15s; font-family:inherit; }
.btn-primary { background:var(--accent); color:#000; }
.btn-primary:hover { background:var(--accent2); transform:translateY(-1px); }
.btn-secondary { background:var(--bg3); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
.btn-danger { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background:var(--red); color:#fff; }
.btn-success { background:rgba(34,197,94,0.15); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
.btn-success:hover { background:var(--green); color:#000; }
.btn-sm { padding:6px 12px; font-size:12px; }
.btn-icon { width:36px; height:36px; padding:0; justify-content:center; border-radius:9px; }

/* CARDS */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.card-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card-title i { color:var(--accent); }

/* STATS GRID */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; position:relative; overflow:hidden; transition:.2s; }
.stat-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow); }
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
.stat-card.gold::before { background:linear-gradient(90deg,var(--accent),var(--accent2)); }
.stat-card.green::before { background:var(--green); }
.stat-card.blue::before { background:var(--blue); }
.stat-card.red::before { background:var(--red); }
.stat-card.purple::before { background:var(--purple); }
.stat-label { font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.stat-value { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; }
.stat-sub { font-size:12px; color:var(--text2); margin-top:4px; }
.stat-icon { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:32px; opacity:.1; }

/* TABLE */
.table-wrap { overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; }
table th { background:var(--bg3); padding:12px 16px; text-align:left; font-size:11px;
  font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
table td { padding:12px 16px; border-top:1px solid var(--border); font-size:13px; white-space:nowrap; }
table tr:hover td { background:rgba(255,255,255,0.02); }
table td a { color:var(--accent); text-decoration:none; font-weight:500; }
table td a:hover { text-decoration:underline; }

/* BADGES */
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.badge-novo { background:rgba(59,130,246,0.2); color:var(--blue); }
.badge-contato { background:rgba(232,160,32,0.2); color:var(--accent); }
.badge-visita { background:rgba(168,85,247,0.2); color:var(--purple); }
.badge-proposta { background:rgba(245,200,66,0.2); color:var(--accent2); }
.badge-contrato { background:rgba(34,197,94,0.2); color:var(--green); }
.badge-fechado { background:rgba(34,197,94,0.3); color:#4ade80; }
.badge-perdido { background:rgba(239,68,68,0.2); color:var(--red); }
.badge-frio { background:rgba(148,163,184,0.2); color:#94a3b8; }
.badge-morno { background:rgba(251,191,36,0.2); color:#fbbf24; }
.badge-quente { background:rgba(239,68,68,0.2); color:var(--red); }
.badge-lancamento { background:rgba(59,130,246,0.2); color:var(--blue); }
.badge-quintoandar { background:rgba(34,197,94,0.2); color:var(--green); }

/* KANBAN */
.kanban-board { display:flex; gap:16px; overflow-x:auto; padding-bottom:16px; min-height:500px; }
.kanban-col { min-width:220px; width:220px; background:var(--bg2); border-radius:var(--radius);
  border:1px solid var(--border); display:flex; flex-direction:column; }
.kanban-header { padding:12px 14px; font-size:12px; font-weight:700; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; }
.kanban-count { background:var(--border); padding:1px 8px; border-radius:10px; font-size:11px; }
.kanban-body { padding:10px; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.kanban-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px;
  cursor:pointer; transition:.15s; border-left:3px solid var(--border); }
.kanban-card:hover { border-color:var(--accent); transform:translateX(2px); }
.kanban-card .k-name { font-size:13px; font-weight:600; margin-bottom:6px; }
.kanban-card .k-info { font-size:11px; color:var(--text2); display:flex; align-items:center; gap:4px; }
.kanban-card .k-tags { display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }

/* FUNIL */
.funil-bar { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.funil-label { width:100px; font-size:12px; color:var(--text2); text-align:right; }
.funil-track { flex:1; height:28px; background:var(--bg3); border-radius:6px; overflow:hidden; }
.funil-fill { height:100%; border-radius:6px; display:flex; align-items:center; padding:0 10px;
  font-size:11px; font-weight:700; color:#000; transition:width 1s ease; }
.funil-total { width:40px; font-size:12px; font-weight:700; color:var(--accent); }

/* FORM / MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:500; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background:var(--card); border:1px solid var(--border); border-radius:16px;
  width:640px; max-width:95vw; max-height:90vh; overflow-y:auto; box-shadow:0 32px 80px rgba(0,0,0,0.6); }
.modal-lg { width:800px; }
.modal-xl { width:1000px; }
.modal-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-header h2 { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; }
.modal-close { background:none; border:none; color:var(--text2); cursor:pointer; font-size:20px; line-height:1; }
.modal-close:hover { color:var(--red); }
.modal-body { padding:24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }

/* FORM */
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-grid.cols3 { grid-template-columns:1fr 1fr 1fr; }
.form-full { grid-column:1/-1; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group label { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
.form-group input, .form-group select, .form-group textarea {
  background:var(--bg2); border:1px solid var(--border); color:var(--text);
  padding:10px 14px; border-radius:9px; font-size:13px; outline:none; transition:.2s;
  font-family:inherit; width:100%;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,160,32,0.1);
}
.form-group textarea { resize:vertical; min-height:80px; }
.form-group select option { background:var(--bg2); }

/* TIMELINE */
.timeline { position:relative; padding-left:28px; }
.timeline::before { content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--border); }
.tl-item { position:relative; margin-bottom:20px; }
.tl-dot { position:absolute; left:-24px; top:4px; width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:2px solid var(--bg); z-index:1; }
.tl-dot.call { background:var(--green); }
.tl-dot.email { background:var(--blue); }
.tl-dot.visita { background:var(--purple); }
.tl-dot.nota { background:var(--text3); }
.tl-content { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
.tl-meta { font-size:11px; color:var(--text3); margin-top:6px; }

/* TABS */
.tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg2);
  padding:4px; border-radius:10px; border:1px solid var(--border); width:fit-content; }
.tab { padding:8px 18px; border-radius:8px; font-size:13px; font-weight:500;
  cursor:pointer; color:var(--text2); transition:.15s; border:none; background:none; font-family:inherit; }
.tab.active { background:var(--accent); color:#000; font-weight:700; }
.tab:hover:not(.active) { color:var(--text); background:rgba(255,255,255,0.05); }

/* PROGRESS */
.progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:6px; }
.progress-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }

/* SEARCH */
.search-box { position:relative; }
.search-box input { padding-left:38px; }
.search-box i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text3); }

/* CHIP/TAG FILTERS */
.filter-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.chip { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:500;
  cursor:pointer; border:1px solid var(--border); color:var(--text2); transition:.15s; }
.chip:hover, .chip.active { border-color:var(--accent); color:var(--accent); background:rgba(232,160,32,0.08); }

/* WHATSAPP */
.wa-phone-list { background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  max-height:200px; overflow-y:auto; }
.wa-phone-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); }
.wa-phone-item:last-child { border-bottom:none; }
.wa-status { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.wa-status.pending { background:var(--text3); }
.wa-status.sent { background:var(--green); }
.wa-status.error { background:var(--red); }
.wa-progress { background:var(--bg2); border-radius:var(--radius); padding:16px; margin-top:12px; }
.wa-progress-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:8px 0; }
.wa-progress-fill { height:100%; background:linear-gradient(90deg,#25d366,#128c7e); border-radius:4px; transition:width .5s; }

/* EMPTY STATE */
.empty-state { text-align:center; padding:60px 20px; color:var(--text3); }
.empty-state i { font-size:48px; margin-bottom:16px; opacity:.3; }
.empty-state p { font-size:15px; }

/* GRID LAYOUTS */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }

/* TOOLTIP */
[title] { cursor:help; }

/* RESPONSIVE */
@media(max-width:768px) {
  #sidebar { width:60px; min-width:60px; }
  .sidebar-logo h2, .nav-item span, .user-info { display:none; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .form-grid { grid-template-columns:1fr; }
}

/* ANIMATIONS */
.fade-in { animation:fadeIn .3s ease; }
.slide-up { animation:fadeUp .3s ease; }

/* CUSTOM SCROLLBAR IN KANBAN */
.kanban-board::-webkit-scrollbar { height:6px; }
.kanban-board::-webkit-scrollbar-track { background:var(--bg); }

/* VALOR HIGHLIGHT */
.valor { font-family:'Syne',sans-serif; font-weight:700; color:var(--accent); }

/* TEMPERATURE DOT */
.temp-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
.temp-dot.frio { background:#94a3b8; }
.temp-dot.morno { background:#fbbf24; }
.temp-dot.quente { background:var(--red); }

/* SECTION HEADER */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.section-header h2 { font-family:'Syne',sans-serif; font-size:16px; font-weight:800; }

/* LEAD PROFILE */
.lead-profile { display:grid; grid-template-columns:1fr 2fr; gap:20px; }
.lead-info-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.lead-avatar-big { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#000; margin-bottom:14px; }
.lead-name { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; margin-bottom:4px; }
.info-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.info-row:last-child { border-bottom:none; }
.info-row i { width:16px; color:var(--accent); }
.info-row span { color:var(--text2); }
.info-row strong { margin-left:auto; text-align:right; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🏠</div>
      <h1>ImobiCRM <span style="color:var(--accent)">Pro</span></h1>
      <p>CRM Imobiliário para Corretores</p>
    </div>
    <label>E-mail</label>
    <input type="email" id="login-email" value="admin@crm.com" placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="login-senha" value="admin123" placeholder="••••••••">
    <button class="btn-login" onclick="fazerLogin()">Entrar no CRM</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="brand">
        <div class="brand-icon">🏠</div>
        <h2>Imobi<span>CRM</span></h2>
      </div>
    </div>

    <div class="nav-section">Principal</div>
    <a class="nav-item active" onclick="nav('dashboard')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
    <a class="nav-item" onclick="nav('leads')"><i class="fas fa-users"></i><span>Leads</span><span class="nav-badge" id="badge-leads">0</span></a>
    <a class="nav-item" onclick="nav('kanban')"><i class="fas fa-columns"></i><span>Funil Kanban</span></a>
    <a class="nav-item" onclick="nav('negocios')"><i class="fas fa-handshake"></i><span>Negócios</span></a>
    <a class="nav-item" onclick="nav('tarefas')"><i class="fas fa-tasks"></i><span>Tarefas</span><span class="nav-badge" id="badge-tarefas">0</span></a>

    <div class="nav-section" style="margin-top:8px">Imóveis</div>
    <a class="nav-item" onclick="nav('empreendimentos')"><i class="fas fa-building"></i><span>Empreendimentos</span></a>

<!-- MODAL CONTAINER -->
<div id="modal-container"></div>

<script>
// ══════════════════════════════════════════════
// API
// ══════════════════════════════════════════════
const api = async (method, url, body=null) => {
  const opts = { method, headers:{'Content-Type':'application/json'}, credentials:'include' };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch('/api'+url, opts);
  return r.json();
};
const GET = url => api('GET', url);
const POST = (url,b) => api('POST', url, b);
const PUT = (url,b) => api('PUT', url, b);
const DEL = url => api('DELETE', url);

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
async function fazerLogin() {
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const r = await POST('/login', {email, senha});
  if(r.success) {
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('user-nome').textContent = r.nome;
    document.getElementById('user-avatar').textContent = r.nome[0].toUpperCase();
    nav('dashboard');
  } else {
    document.getElementById('login-error').textContent = r.error || 'Erro ao fazer login';
  }
}
async function logout() {
  await POST('/logout');
  location.reload();
}
document.getElementById('login-senha').addEventListener('keypress', e => e.key==='Enter' && fazerLogin());

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
const pages = {
  dashboard: renderDashboard,
  leads: renderLeads,
  kanban: renderKanban,
  negocios: renderNegocios,
  tarefas: renderTarefas,
  empreendimentos: renderEmpreendimentos,
  construtoras: renderConstrutoras,
  comissoes: renderComissoes,
  whatsapp: renderWhatsapp,
  unidades: renderUnidades,
  importar: renderImportar,
  configuracoes: renderConfiguracoes,
};
const titles = {
  dashboard:'Dashboard', leads:'Leads', kanban:'Funil Kanban',
  negocios:'Negócios', tarefas:'Tarefas', empreendimentos:'Empreendimentos',
  construtoras:'Construtoras', comissoes:'Comissões', whatsapp:'Disparo WhatsApp',
  unidades:'Tabelão / Unidades', importar:'Importar Dados',
  configuracoes:'Configurações'
};
let currentPage = '';
function nav(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(i => {
    if(i.getAttribute('onclick') === `nav('${page}')`) i.classList.add('active');
  });
  document.getElementById('page-title').textContent = titles[page]||page;
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text3)"><i class="fas fa-spinner fa-spin" style="font-size:24px"></i></div>';
  pages[page]?.();
}

// ══════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════
function modal(title, bodyHtml, footerHtml='', size='') {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal ${size} fade-in">
        <div class="modal-header">
          <h2>${title}</h2>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
      </div>
    </div>`;
}
function closeModal() {
  document.getElementById('modal-container').innerHTML = '';
}

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
const fmt = v => v ? `R$ ${Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})}` : '—';
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('pt-BR') : '—';
const statusBadge = s => {
  const m = {Novo:'novo',Contato:'contato',Visita:'visita',Proposta:'proposta',Contrato:'contrato',Fechado:'fechado',Perdido:'perdido'};
  return `<span class="badge badge-${m[s]||'novo'}">${s}</span>`;
};
const tempBadge = t => `<span class="badge badge-${(t||'frio').toLowerCase()}"><span class="temp-dot ${(t||'frio').toLowerCase()}"></span>${t||'Frio'}</span>`;
const tipoBadge = t => `<span class="badge badge-${t==='QuintoAndar'?'quintoandar':'lancamento'}">${t}</span>`;

// ══════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════
async function renderDashboard() {
  const d = await GET('/dashboard');
  const s = d.stats;

  document.getElementById('badge-leads').textContent = s.leads_novos||'';
  document.getElementById('badge-tarefas').textContent = (s.tarefas_hoje+s.tarefas_atrasadas)||'';

      <div class="funil-label" style="color:var(--text)">${o.origem||'Direto'}</div>

    </div>`).join('');

  const funil_html = d.funil.map((f,i) => `
    <div class="funil-bar">
      <div class="funil-label">${f.status}</div>
      <div class="funil-track"><div class="funil-fill" style="width:${(f.total/max_funil)*100}%;background:${funil_cores[i]}">${f.total}</div></div>
      <div class="funil-total">${f.total}</div>
    </div>`).join('');

  const leads_html = d.ultimos_leads.map(l => `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000;flex-shrink:0">${l.nome[0]}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px;cursor:pointer;color:var(--accent)" onclick="abrirLead(${l.id})">${l.nome}</div>
        <div style="font-size:11px;color:var(--text2)">${l.telefone||''} ${l.empreendimento ? '• '+l.empreendimento : ''}</div>
      </div>
      ${statusBadge(l.status)}
    </div>`).join('');

  const tarefas_html = d.tarefas.length ? d.tarefas.map(t => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${t.prioridade==='Alta'?'var(--red)':t.prioridade==='Media'?'var(--accent)':'var(--text3)'}"></div>
      <div style="flex:1"><div style="font-size:13px;font-weight:500">${t.titulo}</div><div style="font-size:11px;color:var(--text2)">${t.lead_nome||''}</div></div>
      <button class="btn btn-sm btn-success" onclick="concluirTarefa(${t.id})">✓</button>
    </div>`).join('') : '<div class="empty-state" style="padding:20px"><p>Nenhuma tarefa hoje!</p></div>';

  document.getElementById('content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card gold">
        <div class="stat-label">Leads Total</div>
        <div class="stat-value">${s.leads_total}</div>
        <div class="stat-sub">+${s.leads_mes} este mês</div>
        <i class="fas fa-users stat-icon"></i>
      </div>
      <div class="stat-card blue">
        <div class="stat-label">Leads Novos</div>
        <div class="stat-value">${s.leads_novos}</div>
        <div class="stat-sub">Aguardando contato</div>
        <i class="fas fa-user-plus stat-icon"></i>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Fechamentos Mês</div>
        <div class="stat-value">${s.negocios_fechados_mes}</div>
        <div class="stat-sub">${s.negocios_abertos} em andamento</div>
        <i class="fas fa-handshake stat-icon"></i>
      </div>
      <div class="stat-card gold">
        <div class="stat-label">VGV do Mês</div>
        <div class="stat-value" style="font-size:20px">${fmt(s.vgv_mes)}</div>
        <div class="stat-sub">Vendas fechadas</div>
        <i class="fas fa-chart-line stat-icon"></i>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Comissão Mês</div>
        <div class="stat-value" style="font-size:20px">${fmt(s.comissao_mes)}</div>
        <div class="stat-sub">Realizada</div>
        <i class="fas fa-dollar-sign stat-icon"></i>
      </div>
      <div class="stat-card red">
        <div class="stat-label">Tarefas Atrasadas</div>
        <div class="stat-value" style="color:var(--red)">${s.tarefas_atrasadas}</div>
        <div class="stat-sub">${s.tarefas_hoje} para hoje</div>
        <i class="fas fa-exclamation-triangle stat-icon"></i>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:20px">
      <div class="card">
        <div class="card-title"><i class="fas fa-filter"></i> Funil de Vendas</div>
        ${funil_html || '<p style="color:var(--text3);font-size:13px">Nenhum lead cadastrado</p>'}
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-chart-bar"></i> Leads por Origem</div>
        ${origens_html || '<p style="color:var(--text3);font-size:13px">Sem dados</p>'}
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title"><i class="fas fa-clock"></i> Últimos Leads</div>
        ${leads_html || '<div class="empty-state" style="padding:20px"><p>Nenhum lead</p></div>'}
        <div style="margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="nav('leads')">Ver todos →</button></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-calendar-check"></i> Tarefas de Hoje</div>
        ${tarefas_html}
        <div style="margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="nav('tarefas')">Ver todas →</button></div>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════
// LEADS
// ══════════════════════════════════════════════
let leadsData = [];
async function renderLeads(filtros={}) {
  const params = new URLSearchParams(filtros).toString();
  leadsData = await GET('/leads' + (params ? '?'+params : ''));

  document.getElementById('topbar-actions').innerHTML = `
    <div class="search-box"><i class="fas fa-search"></i><input id="lead-search" type="text" placeholder="Buscar lead..." style="width:220px" oninput="filtrarLeads()" /></div>
    <button class="btn btn-primary" onclick="modalNovoLead()"><i class="fas fa-plus"></i> Novo Lead</button>`;

  document.getElementById('content').innerHTML = `
    <div class="filter-chips" id="filter-chips">
      <span class="chip active" onclick="filtroLeads(this,'')">Todos (${leadsData.length})</span>
      <span class="chip" onclick="filtroLeads(this,'Novo','status')">Novos</span>
      <span class="chip" onclick="filtroLeads(this,'Contato','status')">Contato</span>
      <span class="chip" onclick="filtroLeads(this,'Visita','status')">Visita</span>
      <span class="chip" onclick="filtroLeads(this,'Proposta','status')">Proposta</span>
      <span class="chip" onclick="filtroLeads(this,'Fechado','status')">Fechado</span>
      <span class="chip" style="border-color:var(--blue);color:var(--blue)" onclick="filtroLeads(this,'Lancamento','tipo_interesse')">🏗 Lançamento</span>
      <span class="chip" style="border-color:var(--green);color:var(--green)" onclick="filtroLeads(this,'QuintoAndar','tipo_interesse')">🟢 QuintoAndar</span>
      <span class="chip" style="border-color:var(--red);color:var(--red)" onclick="filtroLeads(this,'Quente','temperatura')">🔥 Quente</span>
    </div>
    <div class="table-wrap">
      <table id="leads-table">
        <thead><tr>
          <th>Lead</th><th>Contato</th><th>Interesse</th><th>Temperatura</th>
          <th>Status</th><th>Origem</th><th>Data</th><th>Ações</th>
        </tr></thead>
        <tbody id="leads-tbody">${renderLeadsRows(leadsData)}</tbody>
      </table>
    </div>`;
}

function renderLeadsRows(leads) {
  if(!leads.length) return `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-user-slash"></i><p>Nenhum lead encontrado</p></div></td></tr>`;
  return leads.map(l => `
    <tr>
      <td><div style="font-weight:600;cursor:pointer;color:var(--accent)" onclick="abrirLead(${l.id})">${l.nome}</div>
          <div style="font-size:11px;color:var(--text3)">${l.empreendimento||'—'}</div></td>
      <td>${l.telefone||'—'}<br><span style="font-size:11px;color:var(--text3)">${l.email||''}</span></td>
      <td>${tipoBadge(l.tipo_interesse)}</td>
      <td>${tempBadge(l.temperatura)}</td>
      <td>${statusBadge(l.status)}</td>
      <td style="color:var(--text2)">${l.origem||'—'}</td>
      <td style="color:var(--text2)">${fmtDate(l.criado_em?.split('T')[0]||l.criado_em?.split(' ')[0])}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-secondary btn-icon" onclick="abrirLead(${l.id})" title="Ver lead"><i class="fas fa-eye"></i></button>
          <button class="btn btn-sm btn-secondary btn-icon" onclick="whatsappLead('${l.telefone}','${l.nome}')" title="WhatsApp"><i class="fab fa-whatsapp" style="color:#25d366"></i></button>
        </div>
      </td>
    </tr>`).join('');
}

let _filtroAtivo = {};
function filtroLeads(el, valor, campo) {
  document.querySelectorAll('.filter-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  _filtroAtivo = campo ? {[campo]:valor} : {};
  const busca = document.getElementById('lead-search')?.value||'';
  const params = {..._filtroAtivo, ...(busca?{busca}:{})};
  renderLeads(params);
}
function filtrarLeads() {
  const busca = document.getElementById('lead-search')?.value||'';
  const params = {..._filtroAtivo, ...(busca?{busca}:{})};
  renderLeads(params);
}

async function modalNovoLead() {
  const emprs = await GET('/empreendimentos');
  const opts = emprs.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('');
  modal('Novo Lead', `
    <div class="form-grid">
      <div class="form-group form-full"><label>Nome *</label><input id="l-nome" placeholder="Nome completo"></div>
      <div class="form-group"><label>Telefone</label><input id="l-tel" placeholder="(11) 99999-9999"></div>
      <div class="form-group"><label>Email</label><input id="l-email" type="email" placeholder="email@exemplo.com"></div>
      <div class="form-group"><label>CPF</label><input id="l-cpf" placeholder="000.000.000-00"></div>
      <div class="form-group"><label>Tipo de Interesse</label>

      <div class="form-group"><label>Empreendimento</label>

        <select id="l-origem"><option>Direto</option><option>Instagram</option><option>Facebook</option><option>Google</option><option>Indicação</option><option>Site</option><option>Portal ImóvelWeb</option><option>OLX</option><option>Plantão</option><option>QuintoAndar</option><option>ZAP Imóveis</option><option>Viva Real</option></select>
      </div>
      <div class="form-group"><label>Temperatura</label>
        <select id="l-temp"><option>Frio</option><option>Morno</option><option>Quente</option></select>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="l-status"><option>Novo</option><option>Contato</option><option>Visita</option><option>Proposta</option><option>Contrato</option><option>Fechado</option><option>Perdido</option></select>
      </div>
      <div class="form-group"><label>Valor de Interesse</label><input id="l-valor" type="number" placeholder="500000"></div>
      <div class="form-group form-full"><label>Observações</label><textarea id="l-obs" placeholder="Detalhes sobre o lead..."></textarea></div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarNovoLead()"><i class="fas fa-save"></i> Salvar Lead</button>`);
}

async function salvarNovoLead() {
  const nome = document.getElementById('l-nome').value.trim();
  if(!nome) return alert('Nome é obrigatório!');
  await POST('/leads', {
    nome, telefone: document.getElementById('l-tel').value,
    email: document.getElementById('l-email').value,
    cpf: document.getElementById('l-cpf').value,
    tipo_interesse: document.getElementById('l-tipo').value,
    empreendimento_id: document.getElementById('l-empr').value||null,
    origem: document.getElementById('l-origem').value,
    temperatura: document.getElementById('l-temp').value,
    status: document.getElementById('l-status').value,
    valor_interesse: document.getElementById('l-valor').value||null,
    observacoes: document.getElementById('l-obs').value
  });
  closeModal();
  renderLeads();
}

  const l = d.lead;
  const emprs = await GET('/empreendimentos');
  const optsE = emprs.map(e=>`<option value="${e.id}" ${l.empreendimento_id==e.id?'selected':''}>${e.nome}</option>`).join('');

  modal(`Lead: ${l.nome}`, `
    <div class="tabs">
      <button class="tab active" onclick="switchTab(this,'tab-info')">Informações</button>

        </div>
        <div class="form-group"><label>Empreendimento</label>
          <select id="el-empr"><option value="">-- Nenhum --</option>${optsE}</select>
        </div>
        <div class="form-group"><label>Origem</label>
          <select id="el-origem"><option ${l.origem=='Direto'?'selected':''}>Direto</option><option ${l.origem=='Instagram'?'selected':''}>Instagram</option><option ${l.origem=='Facebook'?'selected':''}>Facebook</option><option ${l.origem=='Google'?'selected':''}>Google</option><option ${l.origem=='Indicação'?'selected':''}>Indicação</option><option ${l.origem=='QuintoAndar'?'selected':''}>QuintoAndar</option><option ${l.origem=='ZAP Imóveis'?'selected':''}>ZAP Imóveis</option><option ${l.origem=='Viva Real'?'selected':''}>Viva Real</option></select>
        </div>
        <div class="form-group"><label>Temperatura</label>

        </div>
        <div class="form-group"><label>Status</label>
          <select id="el-status"><option ${l.status=='Novo'?'selected':''}>Novo</option><option ${l.status=='Contato'?'selected':''}>Contato</option><option ${l.status=='Visita'?'selected':''}>Visita</option><option ${l.status=='Proposta'?'selected':''}>Proposta</option><option ${l.status=='Contrato'?'selected':''}>Contrato</option><option ${l.status=='Fechado'?'selected':''}>Fechado</option><option ${l.status=='Perdido'?'selected':''}>Perdido</option></select>

function tipoIcone(tipo) {
  const m = {Ligação:'call',Email:'email',Visita:'visita'};
  return m[tipo]||'nota';
}

async function salvarLead(id) {
  await PUT(`/leads/${id}`, {
    nome: document.getElementById('el-nome').value,
    telefone: document.getElementById('el-tel').value,
    email: document.getElementById('el-email').value,
    cpf: document.getElementById('el-cpf').value,
    tipo_interesse: document.getElementById('el-tipo').value,
    empreendimento_id: document.getElementById('el-empr').value||null,
    origem: document.getElementById('el-origem').value,
    temperatura: document.getElementById('el-temp').value,
    status: document.getElementById('el-status').value,
    valor_interesse: document.getElementById('el-valor').value||null,
    observacoes: document.getElementById('el-obs').value,
  });
  alert('✅ Lead salvo!');
  closeModal();
  renderLeads();
}

async function registrarInteracao(leadId, tipo, dotClass) {
  const desc = prompt(`Descreva a ${tipo}:`);
  if(!desc) return;
  const novoStatus = prompt('Novo status do lead? (deixe em branco para manter)\nOpções: Novo, Contato, Visita, Proposta, Contrato, Fechado, Perdido');
  await POST(`/leads/${leadId}/interacoes`, {tipo, descricao:desc, novo_status:novoStatus||null});
  abrirLead(leadId);
}

function switchTab(btn, tabId) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  ['tab-info','tab-timeline','tab-negocios'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display = id===tabId?'block':'none';
  });
}

function whatsappLead(tel, nome) {
  if(!tel) return alert('Lead sem telefone cadastrado!');
  const n = tel.replace(/\D/g,'');
  const msg = encodeURIComponent(`Olá ${nome}! Aqui é do CRM Imobiliário.`);
  window.open(`https://wa.me/55${n}?text=${msg}`, '_blank');
}

async function renderKanban() {
  const leads = await GET('/leads');
  const colunas = ['Novo','Contato','Visita','Proposta','Contrato','Fechado'];
  const cores = {'Novo':'var(--blue)','Contato':'var(--accent)','Visita':'var(--purple)','Proposta':'var(--accent2)','Contrato':'#4ade80','Fechado':'var(--green)'};

  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-primary" onclick="modalNovoLead()"><i class="fas fa-plus"></i> Novo Lead</button>`;

  const kanbanHtml = colunas.map(col => {
    const col_leads = leads.filter(l=>l.status===col);
    return `
      <div class="kanban-col">
        <div class="kanban-header" style="border-top:3px solid ${cores[col]}">
          <span style="color:${cores[col]}">${col}</span>
          <span class="kanban-count">${col_leads.length}</span>
        </div>
        <div class="kanban-body">
          ${col_leads.map(l=>`
            <div class="kanban-card" style="border-left-color:${cores[l.temperatura==='Quente'?'red':'frio']}" onclick="abrirLead(${l.id})">
              <div class="k-name">${l.nome}</div>
              <div class="k-info"><i class="fas fa-phone" style="font-size:10px"></i>${l.telefone||'sem tel.'}</div>
              ${l.empreendimento?`<div class="k-info" style="margin-top:4px"><i class="fas fa-building" style="font-size:10px"></i>${l.empreendimento}</div>`:''}
              <div class="k-tags">
                ${tempBadge(l.temperatura)}
                ${tipoBadge(l.tipo_interesse)}
              </div>
            </div>`).join('') || `<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">Vazio</div>`}
        </div>
      </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="kanban-board">${kanbanHtml}</div>`;
}

function calcComissao() {
  const valor = parseFloat(document.getElementById('n-valor')?.value)||0;

  const comissao = valor * perc / 100;
  const el = document.getElementById('n-comissao');
  if(el) el.value = comissao.toFixed(2);
}

          <div style="flex:1">
            <div style="font-weight:600">${t.titulo}</div>
            <div style="font-size:11px;color:var(--text2)">${t.lead_nome||''} ${t.data_vencimento ? '• '+fmtDate(t.data_vencimento.split('T')[0]) : ''}</div>
          </div>
          <span class="badge badge-${t.prioridade==='Alta'?'perdido':t.prioridade==='Media'?'morno':'frio'}">${t.prioridade}</span>

function selecionarIntervalo(btn, val) {
  document.querySelectorAll('.modal [id^="int-"]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('wa-intervalo').value = val;
}

function atualizarListaWA() {
  const lista = document.getElementById('wa-lista');
  const count = document.getElementById('wa-count');
  if(!window._waContatos?.length) {
    lista.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">Nenhum contato adicionado</div>';
    count.textContent = '0 contatos';
    return;
  }
  lista.innerHTML = window._waContatos.map((c,i)=>`
    <div class="wa-phone-item">
      <div class="wa-status pending"></div>
      <div style="flex:1"><div style="font-size:13px;font-weight:500">${c.nome||'Sem nome'}</div><div style="font-size:11px;color:var(--text2)">${c.telefone}</div></div>
      <button class="btn btn-danger btn-sm btn-icon" onclick="window._waContatos.splice(${i},1);atualizarListaWA()"><i class="fas fa-times"></i></button>
    </div>`).join('');
  count.textContent = `${window._waContatos.length} contato(s)`;
}

async function importarLeads() {
  const leads = await GET('/leads');
  const comTel = leads.filter(l=>l.telefone);
  window._waContatos = [...(window._waContatos||[]), ...comTel.map(l=>({nome:l.nome,telefone:l.telefone}))];
  // Deduplicar
  const unique = [];
  const seen = new Set();
  window._waContatos.forEach(c => { if(!seen.has(c.telefone)) { seen.add(c.telefone); unique.push(c); } });
  window._waContatos = unique;
  atualizarListaWA();
  alert(`✅ ${comTel.length} leads importados!`);
}

function adicionarManual() {
  const nome = prompt('Nome (opcional):');
  const tel = prompt('Telefone (com DDD):');
  if(tel) {
    window._waContatos = window._waContatos||[];
    window._waContatos.push({nome:nome||'', telefone:tel});
    atualizarListaWA();
  }
}

function importarCSV() {
  const input = document.createElement('input');
  input.type='file'; input.accept='.csv,.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = ev.target.result.split('\n');
      window._waContatos = window._waContatos||[];
      let added=0;
      lines.forEach(line => {
        const parts = line.split(',').map(p=>p.trim().replace(/["']/g,''));
        if(parts.length>=1 && parts[parts.length-1].replace(/\D/g,'').length>=10) {
          const tel = parts[parts.length-1];
          const nome = parts.length>1 ? parts[0] : '';
          window._waContatos.push({nome, telefone:tel});
          added++;
        }
      });
      atualizarListaWA();
      alert(`✅ ${added} contatos importados do CSV!`);
    };
    reader.readAsText(file);
  };
  input.click();
}

async function criarCampanha() {
  const nome = document.getElementById('wa-nome').value.trim();
  const msg = document.getElementById('wa-msg').value.trim();
  if(!nome || !msg) return alert('Nome e mensagem são obrigatórios!');
  if(!window._waContatos?.length) return alert('Adicione ao menos um contato!');
  const r = await POST('/whatsapp/campanhas', {
    nome_campanha: nome,
    mensagem: msg,
    contatos: window._waContatos,
    intervalo_segundos: parseInt(document.getElementById('wa-intervalo').value)||5
  });
  if(r.success) {
    closeModal();
    renderWhatsapp();
    alert(`✅ Campanha criada com ${window._waContatos.length} contatos!\nAcesse a campanha para iniciar o envio.`);
  }
}

async function iniciarCampanha(id) {
  if(!confirm('Iniciar envio da campanha?')) return;

  const url = '/unidades' + (params.length ? '?'+params.join('&') : '');
  const unidades = await GET(url);

  // Resumo por disponibilidade
  const contagem = {};
  unidades.forEach(u => { contagem[u.disponibilidade] = (contagem[u.disponibilidade]||0)+1; });
  const coresDisp = {'Disponível':'var(--green)','Reservado':'var(--accent)','Vendido':'var(--red)','Bloqueado':'var(--text3)'};
  const resumoEl = document.getElementById('resumo-unidades');

        <div class="stat-value" style="font-size:24px;color:var(--blue)">${unidades.length}</div>
      </div>
    </div>`;
  }

  const dispBadge = d => {
    const m = {'Disponível':'badge-fechado','Reservado':'badge-contato','Vendido':'badge-perdido','Bloqueado':'badge-frio'};
    return `<span class="badge ${m[d]||'badge-frio'}">${d}</span>`;
  };

  const tabEl = document.getElementById('tabela-unidades');

    tabEl.innerHTML = `<div class="empty-state"><i class="fas fa-th"></i><p>Nenhuma unidade encontrada.<br>Importe um tabelão ou adicione manualmente.</p></div>`;
    return;
  }
  tabEl.innerHTML = `<table>
    <thead><tr>
      <th>Empreendimento</th><th>Bloco</th><th>Andar</th><th>Unidade</th>
      <th>Tipologia</th><th>Área Priv.</th><th>Vagas</th>
      <th>Valor Tabela</th><th>Valor c/ Desc.</th><th>% Desc.</th>
      <th>Disponibilidade</th><th>Ações</th>
    </tr></thead>
    <tbody>
      ${unidades.map(u=>`<tr>
        <td style="font-size:12px;color:var(--text2)">${u.empreendimento||'—'}</td>
        <td style="font-weight:600">${u.bloco||'—'}</td>

        <td style="font-size:12px">${u.tipologia||'—'}</td>
        <td>${u.area_privativa ? u.area_privativa+'m²' : '—'}</td>
        <td style="text-align:center">${u.vagas||'—'}</td>
        <td class="valor">${fmt(u.valor_tabela)}</td>
        <td class="valor" style="color:var(--green)">${u.valor_desconto ? fmt(u.valor_desconto) : '—'}</td>
        <td style="text-align:center;color:${u.percentual_desconto?'var(--green)':'var(--text3)'}">${u.percentual_desconto ? u.percentual_desconto.toFixed(1)+'%' : '—'}</td>
        <td>${dispBadge(u.disponibilidade)}</td>

function calcDesconto(p) {
  const vt = parseFloat(document.getElementById(`${p}-vt`)?.value)||0;
  const pct = parseFloat(document.getElementById(`${p}-pct`)?.value)||0;
  if(vt && pct) { const el=document.getElementById(`${p}-vd`); if(el) el.value=(vt*(1-pct/100)).toFixed(2); }
}
function calcPctDesconto(p) {
  const vt=parseFloat(document.getElementById(`${p}-vt`)?.value)||0;
  const vd=parseFloat(document.getElementById(`${p}-vd`)?.value)||0;
  if(vt && vd) { const el=document.getElementById(`${p}-pct`); if(el) el.value=((vt-vd)/vt*100).toFixed(2); }
}
function calcValorDesconto(p) {
  const vt=parseFloat(document.getElementById(`${p}-vt`)?.value)||0;
  const pct=parseFloat(document.getElementById(`${p}-pct`)?.value)||0;
  if(vt && pct) { const el=document.getElementById(`${p}-vd`); if(el) el.value=(vt*(1-pct/100)).toFixed(2); }
}

async function lerArquivoImport(fileInputId, jsonInputId) {
  const fileInput = document.getElementById(fileInputId);
  const jsonInput = document.getElementById(jsonInputId);

  // Prioriza arquivo se selecionado
  if(fileInput?.files?.length) {
    const file = fileInput.files[0];
    const texto = await file.text();
    const nome  = file.name;
    if(nome.endsWith('.json')) {
      try { return { dados: JSON.parse(texto), nome }; } catch(e) { alert('JSON inválido: '+e.message); return null; }
    }
    // CSV → parse
    const linhas = texto.split('\n').filter(Boolean);
    if(linhas.length < 2) { alert('CSV vazio ou sem dados.'); return null; }
    const sep = linhas[0].includes(';') ? ';' : ',';
    const cabecalho = linhas[0].split(sep).map(c=>c.trim().replace(/"/g,''));
    const dados = linhas.slice(1).map(l => {
      const vals = l.split(sep).map(v=>v.trim().replace(/"/g,''));
      const obj = {};
      cabecalho.forEach((c,i) => { obj[c] = vals[i]||''; });
      return obj;
    }).filter(r => Object.values(r).some(v=>v));
    return { dados, nome };
  }

  // Fallback para JSON colado
  const txt = jsonInput?.value?.trim();
  if(!txt) { alert('Selecione um arquivo ou cole o JSON!'); return null; }
  try { return { dados: JSON.parse(txt), nome: 'json-colado' }; }
  catch(e) { alert('JSON inválido: '+e.message); return null; }
}

async function executarImportEmpreendimentos() {
  const r = await lerArquivoImport('imp-empr-file', 'imp-empr-json');
  if(!r) return;
  mostrarResultadoImport(null, true); // loading
  const resp = await POST('/importar/empreendimentos', {
    empreendimentos: r.dados, fonte: r.nome
  });
  mostrarResultadoImport(resp, false, 'Empreendimentos');
  if(resp.importados > 0) setTimeout(()=>nav('empreendimentos'), 2000);
}

async function executarImportUnidades() {
  const eid = document.getElementById('imp-unid-empr').value;
  if(!eid) { alert('Selecione o empreendimento de destino!'); return; }
  const r = await lerArquivoImport('imp-unid-file', 'imp-unid-json');
  if(!r) return;
  // Injeta empreendimento_id em todas as linhas
  const dados = r.dados.map(d => ({...d, empreendimento_id: parseInt(eid)}));
  mostrarResultadoImport(null, true);
  const resp = await POST('/importar/unidades', { unidades: dados, fonte: r.nome });
  mostrarResultadoImport(resp, false, 'Unidades');
  if(resp.importados > 0) setTimeout(()=>nav('unidades'), 2000);
}

function mostrarResultadoImport(resp, loading=false, tipo='') {
  const el = document.getElementById('imp-resultado');
  if(!el) return;
  el.style.display = 'block';
  if(loading) {
    el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--accent)"><i class="fas fa-spinner fa-spin" style="font-size:20px"></i>  Importando...</div>`;
    return;
  }
  const cor  = resp.erros > 0 ? 'var(--accent)' : 'var(--green)';
  const icon = resp.erros > 0 ? '⚠' : '✅';
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px">
      <div style="font-size:32px">${icon}</div>
      <div>
        <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:${cor}">${tipo} — Importação concluída</div>
        <div style="margin-top:4px;font-size:13px;color:var(--text2)">
          <span style="color:var(--green)">✓ ${resp.importados} importados</span>
          ${resp.erros ? `  <span style="color:var(--red)">  ✗ ${resp.erros} erros</span>` : ''}
        </div>
        ${resp.log?.length ? `<div style="margin-top:8px;font-size:11px;color:var(--red)">${resp.log.slice(0,3).join('<br>')}</div>` : ''}
      </div>
    </div>`;
}
