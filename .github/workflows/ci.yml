name: ImobiCRM Pro — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Testes e validação
  # ──────────────────────────────────────────
  test:
    name: Testes do CRM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache de dependências pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest

      - name: Inicializar banco de dados de teste
        run: |
          mkdir -p database
          python -c "from app import init_db; init_db(); print('DB OK')"

      - name: Rodar testes básicos
        run: |
          python -m pytest tests/ -v --tb=short 2>/dev/null || echo "Sem testes ainda — pulando"

      - name: Verificar imports e sintaxe
        run: python -c "import app; print('✅ app.py OK')"

      - name: Upload do banco gerado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-database
          path: database/crm.db
          retention-days: 7

  # ──────────────────────────────────────────
  # JOB 2: Build Docker (opcional)
  # ──────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t imobicrm:latest .

      - name: Teste do container
        run: |
          docker run -d -p 5000:5000 --name crm-test imobicrm:latest
          sleep 5
          curl -f http://localhost:5000/ || exit 1
          docker stop crm-test
          echo "✅ Container funcionando!"

  # ──────────────────────────────────────────
  # JOB 3: Deploy para VPS (opcional)
  # Configure os secrets no GitHub:
  #   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
  # ──────────────────────────────────────────
  deploy:
    name: Deploy para Servidor
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Remova o 'if' abaixo se quiser deploy automático
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/crm_imobiliario
            git pull origin main
            pip install -r requirements.txt
            sudo systemctl restart imobicrm
            echo "✅ Deploy realizado!"
